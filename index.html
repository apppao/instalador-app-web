<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instalador · Gestión</title>
<style>
:root{--bg:#eef1f3;--ink:#1c2428;--brand:#0f4c5c;--accent:#b36b00;--line:#c9d2d6;--err:#9b1c1c;--ok:#14532d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
h1{font-size:1.4rem;margin:0 0 1rem;color:var(--brand)}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:1.25rem;margin:1rem auto;max-width:640px}
.narrow{max-width:420px;margin-top:12vh}
.bar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;background:var(--brand);color:#fff;padding:.75rem 1rem}
.bar nav{display:flex;gap:1rem}
.bar a{color:#fff;padding:.25rem .1rem}
.bar a[aria-current="page"]{border-bottom:3px solid #f2b45c;font-weight:600}
label{display:block;margin:.9rem 0 .25rem;font-weight:600}
input{width:100%;padding:.6rem;border:1px solid #8a979c;border-radius:6px;font:inherit}
input:disabled{background:#f1f3f4}
button{margin-top:1rem;padding:.65rem 1.1rem;border:0;border-radius:6px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;border:1px solid currentColor;color:inherit;margin:0}
.card button.ghost{color:var(--brand)}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid #f2b45c;outline-offset:2px}
#logo-preview{display:block;max-width:128px;max-height:128px;margin-top:.75rem;border:1px solid var(--line)}
.msg{min-height:1.5rem;margin:.75rem 0 0;font-weight:600}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.note{font-size:.9rem;color:#445}
#loading{text-align:center;margin-top:20vh}
[hidden]{display:none!important}
</style>
</head>
<body>
<p id="loading" role="status">Cargando…</p>

<main id="login-view" class="card narrow" hidden>
  <h1>Iniciar sesión</h1>
  <form id="login-form" novalidate>
    <label for="email">Correo electrónico</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="login-btn">Entrar</button>
    <p id="login-msg" class="msg" role="alert"></p>
  </form>
</main>

<div id="app-view" hidden>
  <header class="bar">
    <strong id="biz-title">Instalador</strong>
    <nav aria-label="Principal">
      <a href="#inicio" data-nav="inicio">Inicio</a>
      <a href="#configuracion" data-nav="configuracion">Configuración</a>
    </nav>
    <button id="logout-btn" type="button" class="ghost">Cerrar sesión</button>
  </header>
  <main class="card">
    <section id="inicio" data-section>
      <h1>Inicio</h1>
      <p>Aquí aparecerán tus citas, saldos y cobros cuando se activen los módulos de las próximas fases.</p>
      <p class="note">Los documentos que genere esta aplicación son comerciales y no constituyen comprobante fiscal con NCF.</p>
    </section>
    <section id="configuracion" data-section hidden>
      <h1>Configuración del negocio</h1>
      <form id="biz-form" novalidate>
        <label for="b-name">Nombre comercial (obligatorio)</label>
        <input id="b-name" maxlength="120" required>
        <label for="b-phone">Teléfono</label>
        <input id="b-phone" type="tel" maxlength="40">
        <label for="b-email">Correo</label>
        <input id="b-email" type="email" maxlength="120">
        <label for="b-address">Dirección</label>
        <input id="b-address" maxlength="300">
        <label for="b-currency">Moneda</label>
        <input id="b-currency" value="DOP (RD$)" disabled>
        <label for="b-logo">Logo (imagen pequeña, opcional)</label>
        <input id="b-logo" type="file" accept="image/*">
        <img id="logo-preview" alt="Logo del negocio" hidden>
        <button id="logo-clear" type="button" class="ghost" hidden>Quitar logo</button>
        <button type="submit" id="biz-btn">Guardar cambios</button>
        <p id="biz-msg" class="msg" role="status"></p>
      </form>
    </section>
  </main>
</div>
<script>
window.__fail=function(m){var l=document.getElementById("loading");if(l&&!window.__ready&&!l.hidden){l.textContent="No se pudo iniciar la aplicación. "+m;}};
window.addEventListener("error",function(e){window.__fail(e.message||"No se pudo cargar un archivo de Firebase (puede estar bloqueado por la red).");},true);
window.addEventListener("unhandledrejection",function(e){var r=e.reason||{};window.__fail(String(r.code||r.message||r));});
setTimeout(function(){window.__fail("Tarda demasiado. Revisa tu conexión o prueba desde otra red.");},10000);
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

// La configuración web de Firebase no es secreta: la seguridad la dan el login y firestore.rules.
const firebaseConfig = {
  apiKey: "AIzaSyDUd-NqwfQ_RijEn9V7byEhvyirkwq_xwY",
  authDomain: "nstalador-app-dev.firebaseapp.com",
  projectId: "nstalador-app-dev",
  storageBucket: "nstalador-app-dev.firebasestorage.app",
  messagingSenderId: "377810756486",
  appId: "1:377810756486:web:69a98dfad558d2a4eb0207"
};

const auth = getAuth(initializeApp(firebaseConfig));
const db = getFirestore(auth.app);
const $ = (id) => document.getElementById(id);
const MAX_LOGO = 150000; // caracteres; debe coincidir con firestore.rules
let bizRef = null, busy = false, logo = "";

function showOnly(id) {
  for (const v of ["loading", "login-view", "app-view"]) $(v).hidden = v !== id;
}
function say(id, text, kind) { const el = $(id); el.textContent = text; el.className = "msg" + (kind ? " " + kind : ""); }
function setBusy(btnId, on, label) { busy = on; const b = $(btnId); b.disabled = on; b.textContent = label; }

function route() {
  const view = location.hash === "#configuracion" ? "configuracion" : "inicio";
  document.querySelectorAll("[data-section]").forEach((s) => (s.hidden = s.id !== view));
  document.querySelectorAll("[data-nav]").forEach((a) => {
    if (a.dataset.nav === view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}
window.addEventListener("hashchange", route);

function authMsg(code) {
  if (["auth/invalid-credential", "auth/wrong-password", "auth/user-not-found", "auth/invalid-email"].includes(code)) return "Correo o contraseña incorrectos.";
  if (code === "auth/too-many-requests") return "Demasiados intentos. Espera unos minutos e inténtalo de nuevo.";
  if (code === "auth/network-request-failed") return "Sin conexión. Revisa tu internet.";
  return "No se pudo iniciar sesión (" + code + ").";
}

function showLogo() {
  $("logo-preview").hidden = !logo; $("logo-clear").hidden = !logo;
  if (logo) $("logo-preview").src = logo;
}

onAuthStateChanged(auth, async (user) => {
  window.__ready = true;
  if (!user) { bizRef = null; showOnly("login-view"); return; }
  showOnly("loading");
  try {
    const m = await getDoc(doc(db, "users", user.uid));
    if (!m.exists() || !m.data().businessId) {
      await signOut(auth);
      say("login-msg", "Tu usuario no tiene un negocio asignado.", "err");
      return;
    }
    bizRef = doc(db, "businesses", m.data().businessId);
    const b = await getDoc(bizRef);
    if (!b.exists()) throw new Error("negocio-no-existe");
    const d = b.data();
    $("biz-title").textContent = d.name || "Instalador";
    $("b-name").value = d.name || ""; $("b-phone").value = d.phone || "";
    $("b-email").value = d.email || ""; $("b-address").value = d.address || "";
    logo = d.logoUrl || ""; showLogo();
    showOnly("app-view"); route();
  } catch (e) {
    await signOut(auth);
    say("login-msg", "No se pudieron cargar los datos (" + (e.code || e.message) + "). Revisa tu conexión e inténtalo de nuevo.", "err");
  }
});

$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (busy) return;
  const email = $("email").value.trim(), pw = $("password").value;
  if (!email || !pw) { say("login-msg", "Escribe tu correo y tu contraseña.", "err"); return; }
  say("login-msg", ""); setBusy("login-btn", true, "Entrando…");
  try { await signInWithEmailAndPassword(auth, email, pw); $("password").value = ""; }
  catch (err) { say("login-msg", authMsg(err.code), "err"); }
  finally { setBusy("login-btn", false, "Entrar"); }
});

$("logout-btn").addEventListener("click", () => signOut(auth));

function shrink(file) {
  return new Promise((ok, fail) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 256 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let out = c.toDataURL("image/png");
      if (out.length > MAX_LOGO) out = c.toDataURL("image/jpeg", 0.8);
      out.length <= MAX_LOGO ? ok(out) : fail(new Error("grande"));
    };
    img.onerror = () => fail(new Error("imagen"));
    img.src = url;
  });
}

$("b-logo").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try { logo = await shrink(f); showLogo(); say("biz-msg", "Logo listo. Pulsa «Guardar cambios» para conservarlo."); }
  catch { say("biz-msg", "No se pudo usar esa imagen. Prueba con otra más pequeña.", "err"); }
});
$("logo-clear").addEventListener("click", () => { logo = ""; $("b-logo").value = ""; showLogo(); });

$("biz-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (busy || !bizRef) return;
  const data = { name: $("b-name").value.trim(), phone: $("b-phone").value.trim(), email: $("b-email").value.trim(), address: $("b-address").value.trim(), logoUrl: logo };
  if (!data.name) { say("biz-msg", "Escribe el nombre comercial.", "err"); return; }
  if (data.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.email)) { say("biz-msg", "El correo no tiene un formato válido.", "err"); return; }
  say("biz-msg", ""); setBusy("biz-btn", true, "Guardando…");
  try {
    await updateDoc(bizRef, { ...data, updatedAt: serverTimestamp() });
    $("biz-title").textContent = data.name;
    say("biz-msg", "Cambios guardados.", "ok");
  } catch (err) { say("biz-msg", "No se pudo guardar (" + (err.code || err.message) + "). Inténtalo de nuevo.", "err"); }
  finally { setBusy("biz-btn", false, "Guardar cambios"); }
});
</script>
</body>
</html>
